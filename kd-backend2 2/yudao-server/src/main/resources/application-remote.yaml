# 远程数据库配置 — 用于 Flowable 数据库迁移
# 启动方式: IDEA Run Configuration 的 Active profiles 填 remote
# ⚠️ 注意：本文件包含数据库密码，仅用于开发调试，迁移完成后请删除，切勿提交到公共仓库或部署到生产环境。
server:
  port: 48282

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.ProcessEngineServicesAutoConfiguration
      - org.flowable.spring.boot.EndpointAutoConfiguration
  datasource:
    druid:
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 5
        max-wait: 60000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        filter:
          wall:
            config:
              multi-statement-allow: true
      primary: master
      datasource:
        master:
          url: jdbc:mysql://11963198uevc3.vicp.fun:46348/kbs_dev?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
          username: yudao
          password: yudao2026
        slave:
          lazy: true
          url: jdbc:mysql://11963198uevc3.vicp.fun:46348/kbs_dev?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
          username: yudao
          password: yudao2026

  # Redis：remote 连远程 MySQL，Redis 仍走本机（与 local 一致）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 9

  quartz:
    auto-startup: false

flowable:
  database-schema-update: true
  db-history-used: true
  check-process-definitions: false
  history-level: audit
  dmn:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false
  content:
    enabled: false
  app:
    enabled: false
  eventregistry:
    enabled: false

yudao:
  captcha:
    enable: false
  security:
    mock-enable: true
  tenant:
    enable: false
  access-log:
    enable: false
  demo: false
  websocket:
    enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

logging:
  level:
    root: INFO
  file:
    name: ${user.home}/logs/remote-startup.log

debug: true
