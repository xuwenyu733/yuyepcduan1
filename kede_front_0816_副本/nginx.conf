server {
    listen       80 default_server;
    server_name  _; ## 重要！！！修改成你的外网 IP/域名

    gzip on;
    gzip_static on;         # 极致优化：开启静态 gzip，直接使用前端打包生成的 .gz 文件，减少服务器 CPU 消耗
    gzip_min_length 1k;     # 设置允许压缩的页面最小字节数
    gzip_buffers 4 16k;     # 用来存储 gzip 的压缩结果
    gzip_http_version 1.1;  # 识别 HTTP 协议版本
    gzip_comp_level 2;      # 设置 gzip 的压缩比 1-9。1 压缩比最小但最快，而 9 相反
    gzip_types text/plain application/x-javascript text/css application/xml application/javascript; # 指定压缩类型
    gzip_proxied any;       # 无论后端服务器的 headers 头返回什么信息，都无条件启用压缩

    location /digital-twin/ {
        root   /usr/share/nginx/html/;
        try_files $uri $uri/ /digital-twin/index.html;
    }

    location / { ## 前端项目
        root   /usr/share/nginx/html/;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ { ## 后端项目 - 管理后台
        proxy_pass http://yudao-server:48080/; ## 重要！！！proxy_pass 需要设置为后端项目所在服务器的 IP
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 三模块统一 BFF（鱼病 / 风味 / 阈值 + 鱼病 WS）
    # Docker Compose 服务名 modules-api；同机裸跑可改成 http://127.0.0.1:3020/
    location /modules-api/ {
        proxy_pass http://modules-api:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 任务与计划 / 报警 PMIS（本地 Tomcat）；回切远程改为 https://www.wiidu.com.cn/zx/datainf/
    location /wiidu-datainf/ {
        proxy_pass http://127.0.0.1:8088/zx/datainf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
